# Serves the admin-only SPA build (dist-admin, entry document admin.html).
#
# Mirrors nginx.conf, with two differences: the entry document is admin.html
# rather than index.html, and the console is marked noindex/noarchive at the
# header level as well as in the document.
#
# TLS, HTTP/2, compression negotiation and security headers are handled upstream by Caddy and
# Cloudflare — this server block only has to get caching and the SPA fallback right.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index admin.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Vite emits content-hashed filenames under /assets, so these are safe to cache forever.
    # A new deploy produces new filenames rather than new contents at the same URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # admin.html must never be cached: it is the document that points at the hashed bundles, so a
    # cached copy pins users to the previous deploy indefinitely.
    location = /admin.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback — client-side routes (/admin/finance, /admin/users/:id, …) are not real files.
    location / {
        try_files $uri $uri/ /admin.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
