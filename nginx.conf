# Serves the built SPA. Replaces the SPA-fallback rules that used to live in
# staticwebapp.config.json / netlify.toml / vercel.json.
#
# TLS, HTTP/2, compression negotiation and security headers are handled upstream by Caddy and
# Cloudflare — this server block only has to get caching and the SPA fallback right.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so these are safe to cache forever.
    # A new deploy produces new filenames rather than new contents at the same URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the document that points at the hashed bundles, so a
    # cached copy pins users to the previous deploy indefinitely.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback — client-side routes (/admin/finance, /fans/:id, …) are not real files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
